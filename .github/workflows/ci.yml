name: Community health

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate community files
        run: ruby .github/scripts/validate-community-health.rb

      - name: Validate whitespace
        run: git diff --check
